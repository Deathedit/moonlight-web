[package]
name = "moonlight-web-bridge"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "moonlight-web"
path = "src/main.rs"

[dependencies]
moonlight-common-sys = { path = "../moonlight-common-sys" }
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
hex = "0.4"
mdns-sd = "0.21"
openssl = "0.10"
axum = "0.8"
bytes = "1"
# webrtc re-exports only part of its sans-IO core; codecs, RTCP and interceptors come from rtc.
rtc = "0.21.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
roxmltree = "0.20"
# Same major as reqwest uses, for the pinned-cert verifier passed via use_preconfigured_tls.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
webrtc = "0.21.1"
